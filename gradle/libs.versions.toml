[versions]
agp                     = "9.2.1"
kotlin                  = "2.3.20"
compose-multiplatform   = "1.10.3"

# AndroidX / Jetpack
androidx-activity       = "1.13.0"
androidx-core           = "1.16.0"
lifecycle               = "2.10.0"
datastore               = "1.2.0"

# Networking
ktor                    = "3.4.1"
kotlinx-serialization   = "1.9.0"
kotlinx-coroutines      = "1.10.2"
kotlinx-datetime        = "0.6.2"

# DI
koin                    = "4.1.0"

# Image
coil                    = "3.2.0"

# Logging
kermit                  = "2.1.0"

# Test
junit                   = "4.13.2"
androidx-junit          = "1.3.0"
espresso                = "3.7.0"

[libraries]
# AndroidX (androidMain only)
androidx-activity-compose    = { module = "androidx.activity:activity-compose",              version.ref = "androidx-activity" }
androidx-core-ktx            = { module = "androidx.core:core-ktx",                          version.ref = "androidx-core" }

# Lifecycle (KMP-compatible JetBrains port)
lifecycle-viewmodel-compose  = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose    = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }

# DataStore (multiplatform)
datastore-preferences-core   = { module = "androidx.datastore:datastore-preferences-core",   version.ref = "datastore" }
datastore-preferences        = { module = "androidx.datastore:datastore-preferences",         version.ref = "datastore" }

# Ktor
ktor-client-core             = { module = "io.ktor:ktor-client-core",                         version.ref = "ktor" }
ktor-client-okhttp           = { module = "io.ktor:ktor-client-okhttp",                       version.ref = "ktor" }
ktor-client-darwin           = { module = "io.ktor:ktor-client-darwin",                       version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation",      version.ref = "ktor" }
ktor-serialization-json      = { module = "io.ktor:ktor-serialization-kotlinx-json",          version.ref = "ktor" }
ktor-client-logging          = { module = "io.ktor:ktor-client-logging",                      version.ref = "ktor" }
ktor-client-auth             = { module = "io.ktor:ktor-client-auth",                         version.ref = "ktor" }
ktor-client-mock             = { module = "io.ktor:ktor-client-mock",                         version.ref = "ktor" }

# Serialization / Coroutines / Datetime
kotlinx-serialization-json   = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-datetime             = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "kotlinx-datetime" }

# Koin
koin-core                    = { module = "io.insert-koin:koin-core",                         version.ref = "koin" }
koin-compose                 = { module = "io.insert-koin:koin-compose",                      version.ref = "koin" }
koin-androidx-compose        = { module = "io.insert-koin:koin-androidx-compose",             version.ref = "koin" }

# Coil
coil-compose                 = { module = "io.coil-kt.coil3:coil-compose",                    version.ref = "coil" }
coil-network-ktor            = { module = "io.coil-kt.coil3:coil-network-ktor3",              version.ref = "coil" }

# Logging
kermit                       = { module = "co.touchlab:kermit",                               version.ref = "kermit" }

# Test
junit                        = { module = "junit:junit",                                       version.ref = "junit" }
androidx-junit-ext           = { module = "androidx.test.ext:junit",                          version.ref = "androidx-junit" }
espresso-core                = { module = "androidx.test.espresso:espresso-core",             version.ref = "espresso" }

[plugins]
android-application          = { id = "com.android.application",                         version.ref = "agp" }
android-kmp-library          = { id = "com.android.kotlin.multiplatform.library",        version.ref = "agp" }
kotlin-android               = { id = "org.jetbrains.kotlin.android",                    version.ref = "kotlin" }
kotlin-multiplatform         = { id = "org.jetbrains.kotlin.multiplatform",              version.ref = "kotlin" }
kotlin-compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",             version.ref = "kotlin" }
compose-multiplatform        = { id = "org.jetbrains.compose",                           version.ref = "compose-multiplatform" }
kotlin-serialization         = { id = "org.jetbrains.kotlin.plugin.serialization",       version.ref = "kotlin" }
